name: myflow
input:
  - minLevel: int
  - configIds: string
  - page: int
workflows:
  - workflow:
    - step: MysqlExecute
      in:
        - (( env["mysqlUri"] ))
        - select id, level, player_id, config_id, created_time from hero where level > (( input["minLevel"] )) and config_id in (( "("+input["configIds"]+")" )) order by id desc limit (( (ParseInt(input["page"])-1)*5 )), 5
    - step: MatrixApply
      name: tableData
      in:
        - prev.out
        - col
        - 4
        - TimeConvert(value, "" , "2006-01-02 15:04")
  - workflow:
    - step: MatrixNew
      in:
        - ","
        - 1001, Superman
        - 1002, Spider-Man
        - 1003, Batman
    - step: MatrixVLookUp
      in:
        - tableData.out
        - 3
        - prev.out
        - 0
        - 1
    - step: MatrixInsert
      name: result
      in:
        - prev.out
        - row
        - 0
        - Id
        - Level
        - PlayerId
        - ConfigId
        - UnlockAt
output: result.out