name: redisTest
input:
  - name: string
workflows:
  - workflow:
    - step: RedisExecute
      in:
      - ${env.redisUri}
      - set name ${input.name}
    - step: RedisExecute
      name: getName
      in:
      - ${env.redisUri}
      - get name
    - step: RedisExecute
      in:
      - ${env.redisUri}
      - hmset heros id 1 config_id 1001 nick_name "Thomas Edward" gender Male
    - step: RedisExecute
      in:
      - ${env.redisUri}
      - eval "return {KEYS[1],'b','c'}" 1 a
  - workflow:
    - step: RedisExecute
      name: heros
      in:
      - ${env.redisUri}
      - hgetall heros
    - step: MatrixSelect
      in:
      - heros.out
      - row
      - ${Join(Arange(0,Rows("heros.out"),2)," ","")}
    - step: MatrixTranspose
      name: herosKeys
      in:
      - prev.out
    - step: MatrixSelect
      in:
      - heros.out
      - row
      - ${Join(Arange(1,Rows("heros.out"),2)," ","")}
    - step: MatrixTranspose
      name: herosVals
      in:
      - prev.out
    - step: MatrixMerge
      in:
      - herosKeys.out
      - herosVals.out
      - row
output: getName.out